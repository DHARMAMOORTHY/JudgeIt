<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Code | JudgeIt</title>
    <style>
        *{box-sizing:border-box}body{margin:0;padding:30px 16px;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
        .container{max-width:900px;margin:auto}.panel{background:white;padding:24px;border-radius:12px;box-shadow:0 3px 12px #0000000d}
        h1{color:#172554;margin-top:0}label{display:block;font-weight:600;margin:18px 0 8px}
        select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
        textarea{min-height:300px;font-family:Consolas,monospace;resize:vertical}
        .button{display:inline-block;border:0;border-radius:6px;padding:12px 18px;background:#2563eb;color:white;text-decoration:none;cursor:pointer;font-size:15px}
        .secondary{background:#64748b}.error{color:#b91c1c;font-size:14px}.notice{background:#eff6ff;padding:12px;border-radius:6px;line-height:1.5}
        .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h1>Submit Code</h1>
        <p class="notice">This version stores your submission and records its status as <strong>PENDING</strong>. It does not run untrusted code or calculate an automated score yet.</p>
        <form th:action="@{/submissions}" th:object="${form}" method="post">
            <label for="problemId">Problem</label>
            <select id="problemId" th:field="*{problemId}" required>
                <option value="">-- Select a problem --</option>
                <option th:each="problem : ${problems}" th:value="${problem.id}" th:text="${problem.title}"
                        th:selected="${selectedProblemId != null and selectedProblemId == problem.id}">Sample problem</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('problemId')}" th:errors="*{problemId}"></div>
            <label for="language">Programming language</label>
            <select id="language" th:field="*{language}" required>
                <option value="Java">Java</option><option value="Python">Python</option><option value="C">C</option>
                <option value="C++">C++</option><option value="JavaScript">JavaScript</option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('language')}" th:errors="*{language}"></div>
            <label for="sourceCode">Source code</label>
            <textarea id="sourceCode" th:field="*{sourceCode}" placeholder="Write or paste your solution here..." required></textarea>
            <div class="error" th:if="${#fields.hasErrors('sourceCode')}" th:errors="*{sourceCode}"></div>
            <div class="actions">
                <button class="button" type="submit">Save Submission</button>
                <a class="button secondary" th:href="@{/problems}">Back to Problems</a>
                <a class="button secondary" th:href="@{/submissions}">Submission History</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
