<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submission History | JudgeIt</title>
    <style>
        *{box-sizing:border-box}body{margin:0;padding:30px 16px;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}
        .container{max-width:1100px;margin:auto}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
        h1{margin:0;color:#172554}.button{display:inline-block;padding:11px 16px;border-radius:6px;background:#2563eb;color:white;text-decoration:none}
        .panel{background:white;border-radius:10px;padding:18px;box-shadow:0 3px 12px #0000000d;overflow-x:auto}
        table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:left;padding:13px;border-bottom:1px solid #e5e7eb}
        th{background:#f8fafc;color:#334155}.status{display:inline-block;background:#fef3c7;color:#92400e;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
        .view{color:#1d4ed8;font-weight:bold}.empty{padding:22px;background:white;border-radius:8px}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Submission History</h1><div>
        <a class="button" th:href="@{/submissions/new}">+ Submit Code</a>
        <a class="button" th:href="@{/problems}">Problems</a>
    </div></div>
    <div class="panel" th:if="${!#lists.isEmpty(submissions)}">
        <table><thead><tr><th>ID</th><th>Problem</th><th>Language</th><th>Submitted At</th><th>Verdict</th><th>Result</th></tr></thead>
        <tbody><tr th:each="submission : ${submissions}">
            <td th:text="${submission.id}">1</td><td th:text="${submission.problem.title}">Problem title</td>
            <td th:text="${submission.language}">Java</td>
            <td th:text="${#temporals.format(submission.submittedAt, 'yyyy-MM-dd HH:mm')}">Date</td>
            <td><span class="status" th:text="${submission.verdict}">PENDING</span></td>
            <td><a class="view" th:href="@{/submissions/{id}(id=${submission.id})}">View result</a></td>
        </tr></tbody></table>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(submissions)}">
        <h2>No submissions yet</h2><p>Choose a problem and submit your first solution to see it here.</p>
        <a class="button" th:href="@{/submissions/new}">Submit Code</a>
    </div>
</div>
</body>
</html>
