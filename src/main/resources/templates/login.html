<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JudgeIt | Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 8%;
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }

        .link a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h2>JudgeIt</h2>
</header>

<div class="container">
    <div class="card">

        <h1>Login</h1>
        <p>Login to your JudgeIt account.</p>

        <div class="error" th:if="${loginError}" th:text="${loginError}">
        </div>

        <form action="/login" method="post" th:object="${user}">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Enter your email">

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                th:field="*{password}"
                placeholder="Enter your password">

            <button type="submit">Login</button>

        </form>

        <div class="link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

    </div>
</div>

</body>
</html>
