<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JudgeIt | Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0000000d;
        }

        h1 {
            margin-top: 0;
        }

        .info {
            margin-top: 25px;
        }

        .info p {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .logout {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h2>JudgeIt</h2>
    <a href="/logout">Logout</a>
</header>

<div class="container">
    <div class="card">

        <h1>My Profile</h1>
        <p>Welcome to your JudgeIt account.</p>

        <div class="info">
            <p>
                <strong>Name:</strong>
                <span th:text="${user.name}"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${user.email}"></span>
            </p>
        </div>

        <a class="logout" href="/logout">Logout</a>

    </div>
</div>

</body>
</html>
