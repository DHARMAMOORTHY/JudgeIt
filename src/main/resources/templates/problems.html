
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problems | JudgeIt</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            color: #172554;
            margin: 0;
        }

        .add-button {
            display: inline-block;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .problem-card {
            background: white;
            padding: 22px;
            margin-bottom: 16px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .problem-card h2 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .difficulty {
            display: inline-block;
            padding: 5px 10px;
            background: #e0e7ff;
            color: #3730a3;
            border-radius: 20px;
            font-size: 13px;
        }

        .description {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .edit-button {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 14px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty-message {
            background: white;
            padding: 24px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Practice Problems</h1>
            <a class="add-button" th:href="@{/problems/new}">
                + Add Problem
            </a>
        </div>

        <div th:if="${#lists.isEmpty(problems)}" class="empty-message">
            <p>No problems have been added yet.</p>
        </div>

        <div th:each="problem : ${problems}" class="problem-card">
            <h2 th:text="${problem.title}">Problem Title</h2>

            <span class="difficulty"
                  th:text="${problem.difficulty}">Easy</span>

            <p class="description"
               th:text="${problem.description}">Problem description</p>

            <a class="edit-button"
               th:href="@{/problems/edit/{id}(id=${problem.id})}">
                Edit Problem
            </a>

<form th:action="@{/problems/delete/{id}(id=${problem.id})}"
      method="post"
      onsubmit="return confirm('Are you sure you want to delete this problem?');"
      style="display: inline;">

    <button type="submit"
            style="margin-top: 10px; margin-left: 8px; padding: 9px 14px;
                   background: #dc2626; color: white; border: none;
                   border-radius: 5px; cursor: pointer;">
        Delete Problem
    </button>

</form>

        </div>
    </div>
</body>
</html>
